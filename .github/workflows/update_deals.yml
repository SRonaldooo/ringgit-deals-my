name: Update MYR Game Deals

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:       # Manual trigger button in GitHub UI

permissions:
  contents: write

jobs:
  refresh-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run MYR Deal Arbitrage Tracker
        env:
          AFFILIATE_MODE: ${{ vars.AFFILIATE_MODE || 'phase1_cheapshark' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py

      - name: Commit updated deals.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals.json posted_deals.json || true
          git diff --staged --quiet || git commit -m "chore: refresh MYR game deals [skip ci]"
          git push

